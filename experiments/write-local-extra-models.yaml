# Exact IDs verified against OpenRouter's live model catalog on 2026-09-08.
# API-only execution; shares the original environment model and rollout arm caps.
models:
- name: fable-5.1
  transport: openai
  model: anthropic/claude-fable-5.1
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  temperature: null
  max_tokens: 4096
  timeout_s: 600
  retries: 3
  extra_body:
    reasoning:
      enabled: true
- name: opus-5
  transport: openai
  model: anthropic/claude-opus-5
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  temperature: null
  max_tokens: 4096
  timeout_s: 600
  retries: 3
  extra_body:
    reasoning:
      enabled: true
- name: env-gpt-5.6
  transport: openai
  model: gpt-5.6-sol
  base_url: null
  api_key_env: OPENAI_API_KEY
  temperature: null
  max_tokens: 8000
  timeout_s: 600
  retries: 3
  extra_body:
    reasoning_effort: medium
  max_tokens_key: max_completion_tokens
  reasoning_summary: null
  thinking: adaptive
  effort: null
  sampling: false
  stub_text: CALL submit("stub")
  stub_texts: []
