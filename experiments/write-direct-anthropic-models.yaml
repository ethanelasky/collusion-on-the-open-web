# Direct Anthropic configuration requested by the user.
# Use a fresh COLLUSION_RUN_PREFIX to keep OpenRouter attempts separate.
models:
- name: fable-5.1
  transport: anthropic
  model: claude-fable-5-1
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 4096
  timeout_s: 600
  retries: 3
  thinking: adaptive
  effort: medium
  sampling: false
- name: opus-5
  transport: anthropic
  model: claude-opus-5
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 4096
  timeout_s: 600
  retries: 3
  thinking: adaptive
  effort: medium
  sampling: false
- name: env-gpt-5.6
  transport: openai
  model: gpt-5.6-sol
  base_url: null
  api_key_env: OPENAI_API_KEY
  temperature: null
  max_tokens: 8000
  timeout_s: 600
  retries: 3
  extra_body:
    reasoning_effort: medium
  max_tokens_key: max_completion_tokens
  reasoning_summary: null
  thinking: adaptive
  effort: null
  sampling: false
  stub_text: CALL submit("stub")
  stub_texts: []
