[project]
name = "ai-collusion"
version = "0.1.0"
description = "Model-screening harness: run a timed lookup scenario with a mocked shared message board against several models and save the transcripts."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic==1.4.0",
    "docent-python==0.1.75",
    "openai==3.8.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
]

[project.scripts]
ai-collusion = "ai_collusion.cli:main"
ai-collusion-wiki = "ai_collusion.wiki_cli:main"
ai-collusion-docent = "ai_collusion.docent_cli:main"
ai-collusion-judge = "ai_collusion.judge_cli:main"

ai-collusion-html = "ai_collusion.html_report:main"
ai-collusion-probe = "ai_collusion.probe_cli:main"
ai-collusion-stress = "ai_collusion.stress:main"
ai-collusion-channel = "experiments.covert_channel.run:main"
ai-collusion-channel-analyze = "experiments.covert_channel.analysis:main"
ai-collusion-color = "experiments.color_game.cli:main"

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
]
browser = [
    "playwright>=1.62.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_collusion", "experiments"]

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
